name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  # 1. Validation and Security Auditing
  validate:
    name: Lint, Audit & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Linter
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # 2. SonarCloud Analysis
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 3. Development Continuous Deployment (Triggers ONLY on push to dev branch)
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [validate, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker (Dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: dev
          secrets: |
            SUPABASE_URL_PROD
            SUPABASE_URL_DEV
            RENDERER_URL_DEV
            RENDERER_URL_PROD
        env:
          SUPABASE_URL_PROD: ${{ vars.SUPABASE_URL_PROD }}
          SUPABASE_URL_DEV: ${{ vars.SUPABASE_URL_DEV }}
          RENDERER_URL_DEV: ${{ vars.RENDERER_URL_DEV }}
          RENDERER_URL_PROD: ${{ vars.RENDERER_URL_PROD }}

  # 4. Production Continuous Deployment (Triggers ONLY on push to main branch)
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: [validate, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker (Prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: prod
          secrets: |
            SUPABASE_URL_PROD
            SUPABASE_URL_DEV
            RENDERER_URL_DEV
            RENDERER_URL_PROD
        env:
          SUPABASE_URL_PROD: ${{ vars.SUPABASE_URL_PROD }}
          SUPABASE_URL_DEV: ${{ vars.SUPABASE_URL_DEV }}
          RENDERER_URL_DEV: ${{ vars.RENDERER_URL_DEV }}
          RENDERER_URL_PROD: ${{ vars.RENDERER_URL_PROD }}
