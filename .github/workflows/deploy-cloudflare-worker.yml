name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ github.ref_name == 'main' && '' || 'dev' }}
          secrets: |
            SUPABASE_URL_PROD
            SUPABASE_URL_DEV
            RENDERER_URL_DEV
            RENDERER_URL_PROD
        env:
          SUPABASE_URL_PROD: ${{ vars.SUPABASE_URL_PROD }}
          SUPABASE_URL_DEV: ${{ vars.SUPABASE_URL_DEV }}
          RENDERER_URL_DEV: ${{ vars.RENDERER_URL_DEV }}
          RENDERER_URL_PROD: ${{ vars.RENDERER_URL_PROD }}
